name: Build and Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {
            $ver = $Matches[1]
          } else {
            $desc = (git describe --tags --abbrev=0 2>$null) ; $null = $LASTEXITCODE
            if ($desc -match "^v(.+)$") {
              $ver = $Matches[1]
            } else {
              $ver = "0.0.0"
            }
          }
          echo "APP_VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Build
        run: >
          msbuild Em68030_WinUI3Cpp.sln -restore
          -p:Configuration=Release
          -p:Platform=x64
          -p:PlatformToolset=v143
          -p:AppVersion=${{ steps.version.outputs.APP_VERSION }}
          -v:minimal

      - name: Test
        run: Em68030/x64/Release/Em68030.Tests.exe --gtest_filter=-ResourceIntegrityTest.*

      - name: Prepare release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $src = "Em68030/x64/Release"
          $dst = "release"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # Copy main exe and WindowsAppSDK DLLs
          Copy-Item "$src/Em68030.exe" $dst
          Get-ChildItem "$src/*.dll" |
            Where-Object { $_.Name -notlike "*.Tests.*" } |
            Copy-Item -Destination $dst

          # Exclude MsixContent, Tests, PDBs
          Get-ChildItem $dst | Where-Object {
            $_.Name -like "*.pdb" -or
            $_.Name -like "*Tests*"
          } | Remove-Item -Force

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: iscc installer/setup.iss /DAppVersion=${{ github.ref_name }} /DArch=x64

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Em68030-WinUI3Cpp
          path: installer/Output/Em68030-WinUI3-Setup-*-*.exe
