name: Build and Test

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {
            $ver = $Matches[1]
          } else {
            $desc = (git describe --tags --abbrev=0 2>$null) ; $null = $LASTEXITCODE
            if ($desc -match "^v(.+)$") {
              $ver = $Matches[1]
            } else {
              $ver = "0.0.0"
            }
          }
          echo "APP_VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Build
        run: >
          msbuild Em68030_WinUI3Cpp.sln -restore
          -p:Configuration=Release
          -p:Platform=x64
          -p:PlatformToolset=v143
          -p:AppVersion=${{ steps.version.outputs.APP_VERSION }}
          -v:minimal

      - name: Test
        run: Em68030/x64/Release/Em68030.Tests.exe

      - name: Code Analysis
        shell: cmd
        run: >
          msbuild Em68030/Em68030.vcxproj
          -p:Configuration=Release
          -p:Platform=x64
          -p:PlatformToolset=v143
          -p:RunCodeAnalysis=true
          -p:CAExcludePath="$(ProjectDir)ThirdParty"
          -v:quiet
          -nologo

      - name: Prepare release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $src = "Em68030/x64/Release"
          $dst = "release"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # Copy main exe, DLLs, resource files, and XAML
          Copy-Item "$src/Em68030.exe" $dst
          Get-ChildItem "$src/*.dll" |
            Where-Object { $_.Name -notlike "*.Tests.*" } |
            Copy-Item -Destination $dst
          Copy-Item "$src/*.pri" $dst
          Copy-Item "$src/*.xbf" $dst

          # Copy Strings (MRT Core localization for unpackaged apps)
          Copy-Item "Em68030/Strings" "$dst/Strings" -Recurse

          # Copy Assets, XAML theme resources, and localization directories
          Copy-Item "$src/Assets" "$dst/Assets" -Recurse
          if (Test-Path "$src/Microsoft.UI.Xaml") {
            Copy-Item "$src/Microsoft.UI.Xaml" "$dst/Microsoft.UI.Xaml" -Recurse
          }
          Get-ChildItem "$src" -Directory |
            Where-Object { $_.Name -match '^[a-z]{2}(-[A-Za-z]{2,}){0,2}$' } |
            ForEach-Object { Copy-Item $_.FullName "$dst/$($_.Name)" -Recurse }

          # Exclude PDBs and test artifacts
          Get-ChildItem $dst -Recurse | Where-Object {
            $_.Name -like "*.pdb" -or
            $_.Name -like "*Tests*"
          } | Remove-Item -Force

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: iscc installer/setup.iss /DAppVersion=${{ github.ref_name }} /DArch=x64

      - name: Virus scan installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer/Output/Em68030-WinUI3-Setup-*-*.exe" | Select-Object -First 1
          Write-Host "Scanning $($installer.FullName)..."
          Update-MpSignature
          Start-MpScan -ScanType CustomScan -ScanPath $installer.FullName
          $threats = Get-MpThreatDetection 2>$null
          if ($threats) {
            Write-Error "Threat detected: $($threats | Format-List | Out-String)"
            exit 1
          }
          Write-Host "Scan passed: no threats detected."

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Em68030-WinUI3Cpp
          path: installer/Output/Em68030-WinUI3-Setup-*-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          INSTALLER=$(ls installer/Output/Em68030-WinUI3-Setup-*-*.exe | head -1)
          INSTALLER_NAME=$(basename "$INSTALLER")
          # Delete existing release if tag was moved to a new commit
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$INSTALLER" --title "$TAG" --notes "$(cat <<EOF
          ## Em68030 ${TAG} (C++/WinUI3)

          MC68030/MVME147 emulator — Windows x64 installer.

          ### Assets
          - **${INSTALLER_NAME}** — Windows x64 installer

          ### Installation
          Run the installer. No prerequisites required (all dependencies are bundled).
          Settings are saved to \`%LOCALAPPDATA%\\Em68030_WinUI3Cpp\\\`.

          ### Security
          - Virus scan: **Passed** (Windows Defender, signatures updated at build time)

          ### Source Code (Apache-2.0)
          - **Repository**: [Em68030_WinUI3Cpp](https://github.com/${{ github.repository }})
          - **Build workflow**: [.github/workflows/build.yml](https://github.com/${{ github.repository }}/blob/${TAG}/.github/workflows/build.yml)
          EOF
          )"
