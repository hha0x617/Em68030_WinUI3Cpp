name: Build and Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Em68030.Tests/packages.config -PackagesDirectory Em68030/packages

      - name: Build
        run: >
          msbuild Em68030_WinUI3Cpp.sln
          -p:Configuration=Release
          -p:Platform=x64
          -p:PlatformToolset=v143
          -v:minimal

      - name: Test
        run: Em68030/x64/Release/Em68030.Tests.exe

      - name: Prepare release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $src = "Em68030/x64/Release"
          $dst = "release"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # Copy main exe and WindowsAppSDK DLLs
          Copy-Item "$src/Em68030.exe" $dst
          Get-ChildItem "$src/*.dll" |
            Where-Object { $_.Name -notlike "*.Tests.*" } |
            Copy-Item -Destination $dst

          # Exclude MsixContent, Tests, PDBs
          Get-ChildItem $dst | Where-Object {
            $_.Name -like "*.pdb" -or
            $_.Name -like "*Tests*"
          } | Remove-Item -Force

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: iscc installer/setup.iss /DAppVersion=${{ github.ref_name }} /DSourceDir=release

      - name: Upload artifact
        id: upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Em68030-WinUI3Cpp
          path: installer/Output/Em68030-Setup-*.exe

  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '<SIGNPATH_ORGANIZATION_ID>'
          project-slug: '<SIGNPATH_PROJECT_SLUG>'
          signing-policy-slug: '<SIGNPATH_SIGNING_POLICY_SLUG>'
          artifact-configuration-slug: '<SIGNPATH_ARTIFACT_CONFIGURATION_SLUG>'
          github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: signed/Em68030-Setup-*.exe
